<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React on Tomcat Without NPM</title>
    
    
    <!-- Load React and ReactDOM Core Libraries via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    

    <!-- Load Babel to compile JSX dynamically in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

    <!-- Target container where React will render the UI -->
    <div id="root"></div>

    <!-- Note the type="text/babel" - this triggers Babel execution -->
    <script type="text/babel" data-type="module">
        // Define a simple functional component

        const { useState, useEffect } = React;

        function App() {

            const [sensors, setSensors] = useState([])
            
            const [rooms, setRooms] = useState([
                { room: 'Living Room', x: 40, y: 40, w: 260, h: 200 },
                { room: 'Dining Room', x: 300, y: 40, w: 180, h: 200 },
                { room: 'Kitchen', x: 480, y: 40, w: 160, h: 200 },
                { room: 'Bed Room', x: 40, y: 240, w: 260, h: 180 },
                { room: 'Toilet', x: 300, y: 240, w: 120, h: 180 },
            ]);

            const dataByRoom = Object.fromEntries(rooms.map((r) => [r.room, r]))

            useEffect(() => {
                
                const timer = setInterval(() => {
                    fetch("http://192.168.1.10:5000/api/sensors")
                    .then(res => res.json())
                    .then(json => setSensors(json.data))
                }, 3000)

                return () => clearInterval(timer)

            }, []);

            return (
                <div>
                    <h2>Sensor Data</h2>
                    {sensors.length > 0 ? 
                        <div>
                            <svg width="680" height="460" style={{ border: '1px solid #ccc' }}>
                                {sensors.map((sensor) => {

                                    console.log("this",sensor)
                                    const room_dim = dataByRoom[sensor.sensor_room]

                                    return (                                
                                        <g key={sensor.sensor_room}>
                                            <rect x={room_dim.x} y={room_dim.y} width={room_dim.w} height={room_dim.h} 
                                                fill={sensor.motion ? "#b5e550": "#E5E4E2"} 
                                                stroke={sensor.motion ? "#809c13": "#D3D3D3"} 
                                                strokeWidth={2} 
                                            />
                                            <text x={room_dim.x +10} y={room_dim.y +20} fontSize={12}>{sensor.sensor_room} </text>
                                            <text x={room_dim.x +10} y={room_dim.y +35} fontSize={12}>Time: {new Date(sensor.timestamp).toLocaleString()}</text>
                                        </g>
                                    )
                                })
                                }
                            </svg>                            
                        </div>
                    : <div>Retieving Data...</div>}
                </div> 
            )
        }

        // Render the component into the root DOM element
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
