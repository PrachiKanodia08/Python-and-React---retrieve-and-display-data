<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React on Tomcat Without NPM</title>
    
    
    <!-- Load React and ReactDOM Core Libraries via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    

    <!-- Load Babel to compile JSX dynamically in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

    <!-- Target container where React will render the UI -->
    <div id="root"></div>

    <!-- Note the type="text/babel" - this triggers Babel execution -->
    <script type="text/babel" data-type="module">
        // Define a simple functional component

        const { useState, useEffect } = React;

        function App() {

            const [sensors, setSensors] = useState([])
            //const [rooms, setRooms] = useState([])

            // const [sensors, setSensors] = useState([
            //     {"sensor_room": "Bed Room", "motion": false, "timestamp": "2026-07-22T13:15:08.576777"},
            //     {"sensor_room": "Kitchen", "motion": true, "timestamp": "2026-07-22T13:15:08.603907"},
            //     {"sensor_room": "Living Room", "motion": true, "timestamp": "2026-07-22T13:15:10.416321"},
            //     {"sensor_room": "Dining Room", "motion": false, "timestamp": "2026-07-22T13:15:11.375100"},
            //     {"sensor_room": "Toilet", "motion": false, "timestamp": "2026-07-22T13:15:14.556796"}
            // ])

            // const [sensors, setSensors] = useState([
            //     {"sensor_room": "Bed Room", "motion": "Object Moved Away", "timestamp": "2026-07-22T13:15:08.576777"},
            //     {"sensor_room": "Kitchen", "motion": "Object Moved Away", "timestamp": "2026-07-22T13:15:08.603907"},
            //     {"sensor_room": "Living Room", "motion": "Room Empty", "timestamp": "2026-07-22T13:15:10.416321"},
            //     {"sensor_room": "Dining Room", "motion": "Movement Detected", "timestamp": "2026-07-22T13:15:11.375100"},
            //     {"sensor_room": "Toilet", "motion": "Movement Detected", "timestamp": "2026-07-22T13:15:14.556796"}
            // ])

            // const [sensors, setSensors] = useState([
            //     {"sensor": "1", "status": "Not Detected", "light": 91, "Moving Target": true, "Moving Target Dist": 28, "Stationary Target": false, "Stationary Target Dist": 26, "timestamp": "2026-08-19T22:32:48.326478"},
            //     {"sensor": "2", "status": "Not Detected", "light": 91, "Moving Target": false, "Moving Target Dist": 28, "Stationary Target": false, "Stationary Target Dist": 26, "timestamp": '2026-08-19T22:32:48.326478'},
            //     {"sensor": "3", "status": "Detected", "light": 5, "Moving Target": false, "Moving Target Dist": 4, "Stationary Target": true, "Stationary Target Dist": 6, "timestamp": '2026-08-19T22:32:54.328052'},
            //     {"sensor": "4", "status": "Not Detected", "light": 46, "Moving Target": true, "Moving Target Dist": 11, "Stationary Target": true, "Stationary Target Dist": 26, "timestamp": '2026-08-19T22:33:00.329029'},
            //     {"sensor": "5", "status": "Detected", "light": 43, "Moving Target": false, "Moving Target Dist": 6, "Stationary Target": false, "Stationary Target Dist": 23, "timestamp": '2026-08-19T22:33:12.331269'}
            // ])
            
            const [rooms, setRooms] = useState([
                { sensor: "1", room: 'Living Room', x: 40, y: 40, w: 260, h: 200 },
                { sensor: "2", room: 'Dining Room', x: 300, y: 40, w: 180, h: 200 },
                { sensor: "3", room: 'Kitchen', x: 480, y: 40, w: 160, h: 200 },
                { sensor: "4", room: 'Bed Room', x: 40, y: 240, w: 220, h: 180 },
                { sensor: "5", room: 'Toilet', x: 260, y: 240, w: 160, h: 180 },
            ])

            const dataByRoom = Object.fromEntries(rooms.map((r) => [r.sensor, r]))

            useEffect(() => {
                
                const timer = setInterval(() => {
                    fetch("http://192.168.1.7/:5000/api/sensors")
                    .then(res => res.json())
                    .then(json => setSensors(json.data))
                }, 3000)

                return () => clearInterval(timer)

            }, []);

            return (
                <div>
                    <h2>Sensor Data</h2>
                    {sensors.length > 0 ? 
                        <div>
                            <svg width="680" height="460" style={{ border: '1px solid #ccc' }}>
                                {sensors.map((s) => {

                                    const room_dim = dataByRoom[s.sensor]

                                    return (                                
                                        <g key={s.sensor}>
                                            <rect x={room_dim.x} y={room_dim.y} width={room_dim.w} height={room_dim.h} 
                                                fill={s.status === "Detected" ? "#b5e550" : "#E5E4E2"}      // "#b5e550" - green , "#E5E4E2" - gray
                                                stroke={s.status === "Detected" ? "#809c13" : "#D3D3D3"}    // "#809c13" - green , "#D3D3D3" - gray
                                                strokeWidth={2} 
                                            />
                                            <text x={room_dim.x +10} y={room_dim.y +20} fontSize={12}>{room_dim.room} </text>
                                            <text x={room_dim.x +10} y={room_dim.y +35} fontSize={12}>Date: {new Date(s.timestamp).toLocaleDateString()}</text>
                                            <text x={room_dim.x +10} y={room_dim.y +50} fontSize={12}>
                                                {s.status === "Detected" ? "Occupied since" : "Empty since"} {new Date(s.timestamp).toLocaleTimeString()}
                                            </text>
                                        </g>
                                    )
                                })
                                }
                            </svg>                            
                        </div>
                    : <div>Retieving Data...</div>}
                </div> 
            )

        }

        // Render the component into the root DOM element
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
